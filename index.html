<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js"></script>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td,
        th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Scientific Name</th>
            <th>Calculation (Solar Time)</th>
            <th>Solar Time</th>
            <th>Local Standard Time</th>
        </tr>
        <tr>
            <td>Astronomical Dawn</td>
            <td>t(-15°)</td>
            <td id="dawn-solar"></td>
            <td id="dawn-local"></td>
        </tr>
        <tr>
            <td>Solar Noon</td>
            <td>12 hr</td>
            <td id="noon-solar"></td>
            <td id="noon-local"></td>
        </tr>
        <tr>
            <td>Afternoon</td>
            <td>t(arccot(2 + cot(θ(12 hr))))</td>
            <td id="afternoon-solar"></td>
            <td id="afternoon-local"></td>
        </tr>
        <tr>
            <td>Sunset</td>
            <td>t(0°)</td>
            <td id="sunset-solar"></td>
            <td id="sunset-local"></td>
        </tr>
        <tr>
            <td>Astronomical Dusk</td>
            <td>t(-15°)</td>
            <td id="dusk-solar"></td>
            <td id="dusk-local"></td>
        </tr>
    </table>

    <!-- Longitude: <input id="longitude" type="number" name="longitude" value="0" step="0.000001"/>
    Latitude: <input id="latitude" type="number" name="latitude" value="0" step="0.000001"/>
    Standard Meridian: <input id="meridian" type="number" name="meridian" value="-75" step="1"/>
    Day Number: <input id="meridian" type="number" name="meridian" value="-75" step="1"/>
    Day Light Savings Offset: <input id="dls" type="number" name="dls" value="1" step="1" max="1" min="0"/> -->
</body>

</html>
